<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("theme"))||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Panel admin: kelola e-book dan pantau peminjaman">
  <title>Panel admin · E-Library</title>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="admin.html"><svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg> E-Library</a>
      <nav class="nav-right" aria-label="Navigasi akun">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Ganti tema terang atau gelap"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <span class="user-chip" id="userChip">…</span>
        <button type="button" id="logoutBtn" class="btn btn-ghost btn-sm">Keluar</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Panel admin</h1>
        <p>Kelola katalog e-book dan pantau semua peminjaman.</p>
      </div>
      <dl class="stats" aria-label="Ringkasan perpustakaan">
        <div><dt>Judul e-book</dt><dd id="stEbook">0</dd></div>
        <div><dt>Total stok</dt><dd id="stStok">0</dd></div>
        <div><dt>Sedang dipinjam</dt><dd id="stPinjam">0</dd></div>
        <div><dt>Terlambat</dt><dd id="stLate">0</dd></div>
      </dl>
    </section>

    <div class="section-head">
      <div class="tabs" id="mainTabs" role="group" aria-label="Bagian panel">
        <button type="button" data-tab="ebook" aria-pressed="true">Kelola e-book</button>
        <button type="button" data-tab="peminjaman" aria-pressed="false">Semua peminjaman</button>
      </div>
    </div>

    <!-- Tab: e-book -->
    <section id="panelEbook" aria-label="Kelola e-book">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="hidden" for="adminSearch">Cari e-book</label>
          <input type="search" id="adminSearch" placeholder="Cari judul, penulis, atau kategori" autocomplete="off">
        </div>
        <button type="button" class="btn btn-primary" id="addBtn">+ Tambah e-book</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>E-book</th><th>Kategori</th><th>Tahun</th><th>Stok</th><th class="col-act">Aksi</th></tr></thead>
          <tbody id="ebookRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Tab: peminjaman -->
    <section id="panelLoans" class="hidden" aria-label="Semua peminjaman">
      <div class="toolbar">
        <div class="tabs" id="loanTabs" role="group" aria-label="Filter status">
          <button type="button" data-f="semua" aria-pressed="true">Semua</button>
          <button type="button" data-f="aktif" aria-pressed="false">Aktif</button>
          <button type="button" data-f="terlambat" aria-pressed="false">Terlambat</button>
          <button type="button" data-f="selesai" aria-pressed="false">Selesai</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Peminjam</th><th>E-book</th><th>Dipinjam</th><th>Jatuh tempo</th><th>Status</th><th class="col-act">Aksi</th></tr></thead>
          <tbody id="loanRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
