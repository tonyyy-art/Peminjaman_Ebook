<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("theme"))||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Masuk ke Sistem Peminjaman E-Book">
  <title>Masuk · E-Library</title>
</head>
<body class="auth-body">
  <div class="auth-top"><button type="button" class="icon-btn" data-theme-toggle aria-label="Ganti tema terang atau gelap"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
  <main class="auth-layout">
    <aside class="shelf" id="shelf" aria-hidden="true"></aside>
    <section class="auth-card" aria-labelledby="judulLogin">
      <header class="auth-head">
        <span class="brand"><svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg> E-Library</span>
        <h1 id="judulLogin">Masuk dan mulai meminjam</h1>
        <p>Katalog, peminjaman, dan riwayat Anda ada di satu tempat.</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@umm.ac.id" autocomplete="email" required>
          <small class="field-error" id="emailError"></small>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="toggle-pass" aria-pressed="false">Tampilkan</button>
          </div>
          <small class="field-error" id="passwordError"></small>
          <small class="field-hint hidden" id="capsHint">Caps Lock sedang aktif.</small>
        </div>
        <div class="alert error hidden" id="loginError" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Masuk</button>
      </form>

      <footer class="auth-foot">
        <p>Coba dengan akun demo:</p>
        <div class="demo-row">
          <button type="button" class="btn btn-ghost btn-sm" data-demo="member@umm.ac.id" data-pass="member123">Member</button>
          <button type="button" class="btn btn-ghost btn-sm" data-demo="admin@umm.ac.id" data-pass="admin123">Admin</button>
        </div>
      </footer>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
